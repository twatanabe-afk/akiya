<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e293b">
  <title>郡山市 空き家現地調査システム (R8)</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title">
        <span>郡山市 空き家調査</span>
        <span id="netStatus" class="badge-status badge-online">オンライン</span>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn-top primary" id="btnOpenDataModal">入出力・設定</button>
      </div>
    </header>

    <main class="map-wrap">
      <div id="map"></div>

      <div class="floating-stats">
        <div id="statsText">読込中...</div>
        <div class="legend-row" id="legendWrap"></div>
      </div>

      <div class="floating-tools">
        <button type="button" class="fab" id="btnGps" title="現在地を追尾">📍</button>
      </div>
    </main>

    <!-- Survey Input Drawer -->
    <div id="surveyDrawer" class="drawer">
      <div class="drawer-header">
        <div>
          <h2 id="drawerTitle">家屋ID</h2>
          <div class="drawer-sub" id="drawerSub">住所</div>
        </div>
        <button type="button" class="btn-top" id="btnCloseDrawer">閉じる ✕</button>
      </div>

      <div class="score-bar">
        <span>不良度評点: <span class="score-pill" id="liveBadnessScore">0 点</span></span>
        <span>危険性該当数: <span class="score-pill" id="liveDangerCount">0 件</span></span>
      </div>

      <div class="section-tabs" id="sectionTabs"></div>

      <div class="drawer-body">
        <!-- Photo Capture Card -->
        <div class="photo-box" id="photoBox">
          <div style="font-weight:700; font-size:14px; margin-bottom:4px;">📷 現地写真撮影（家屋ID自動紐づけ）</div>
          <div id="photoHint" style="font-size:12px; color:#334155; margin-bottom:8px;"></div>
          <label class="photo-btn">
            <span>カメラを起動して撮影（または選択）</span>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple style="display:none;">
          </label>
          <div class="photo-grid" id="photoGrid"></div>
        </div>

        <!-- Dynamic 133 Fields -->
        <div id="formSectionsContainer"></div>
      </div>

      <div class="drawer-footer">
        <button type="button" class="btn-footer btn-cancel" id="btnCancelDrawer">キャンセル</button>
        <button type="button" class="btn-footer btn-save" id="btnSaveHouse">この内容で保存</button>
      </div>
    </div>

    <!-- Data Import/Export Modal -->
    <div id="dataModal" class="modal-backdrop">
      <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="margin:0;">データ入出力・オフライン設定</h3>
          <button type="button" class="btn-top" id="btnCloseDataModal">✕</button>
        </div>

        <div class="modal-group">
          <div style="font-weight:700; font-size:13px; margin-bottom:4px;">1. 調査員名（自動入力用）</div>
          <input type="text" id="defaultSurveyorInput" placeholder="例：郡山 調査員A">
        </div>

        <div class="modal-group">
          <div style="font-weight:700; font-size:13px; margin-bottom:4px;">2. 担当エリアの家屋GeoJSONを読み込む</div>
          <div style="font-size:11px; color:#64748b; margin-bottom:6px;">※事前に分割した担当エリアのGeoJSONを選択してください</div>
          <input type="file" id="geojsonFileInput" accept=".geojson,.json">
        </div>

        <div class="modal-group">
          <div style="font-weight:700; font-size:13px; margin-bottom:4px;">3. オフライン背景地図（PMTiles）を読み込む</div>
          <div style="font-size:11px; color:#64748b; margin-bottom:6px;">※通信圏外で地理院ベクトル地図を表示する場合に選択します</div>
          <input type="file" id="pmtilesFileInput" accept=".pmtiles">
        </div>

        <div class="modal-group">
          <div style="font-weight:700; font-size:13px; margin-bottom:4px;">4. 調査データの出力（バックアップ・提出）</div>
          <div style="font-size:11px; color:#64748b; margin-bottom:6px;">属性反映済GeoJSON・CSV・家屋ID紐づけ済写真（photos/）をZIP出力します</div>
          <button type="button" class="modal-btn" id="btnExportZip">調査結果と写真をZIPで一括出力</button>
        </div>

        <div>
          <button type="button" class="modal-btn danger" id="btnResetSample">端末データを初期化（サンプルに戻す）</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/dexie@4.0.8/dist/dexie.min.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="./js/schema.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
